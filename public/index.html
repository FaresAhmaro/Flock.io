<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Worm.io Clone</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0d1117; font-family: 'Segoe UI', Arial, sans-serif; }
  canvas { display: block; background: #11151c; }

  #startScreen {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: radial-gradient(circle at center, #1b2230, #0a0d12);
    z-index: 10;
  }
  #startScreen h1 { color: #fff; font-size: 42px; margin-bottom: 20px; letter-spacing: 2px; }
  #startScreen h1 span { color: #5ecbff; }
  #nameInput {
    padding: 12px 16px; font-size: 18px; border-radius: 8px; border: none;
    outline: none; width: 260px; text-align: center; margin-bottom: 16px;
  }
  #playBtn {
    padding: 12px 32px; font-size: 18px; border: none; border-radius: 8px;
    background: #5ecbff; color: #0a0d12; font-weight: bold; cursor: pointer;
    transition: transform 0.1s ease;
  }
  #playBtn:hover { transform: scale(1.05); }
  #hint { color: #8892a0; margin-top: 14px; font-size: 14px; }

  #hud {
    position: fixed; top: 12px; left: 12px; color: #fff; font-size: 14px;
    background: rgba(0,0,0,0.35); padding: 8px 12px; border-radius: 8px; z-index: 5;
  }
  #leaderboard {
    position: fixed; top: 12px; right: 12px; background: rgba(0,0,0,0.35);
    color: #fff; padding: 10px 14px; border-radius: 8px; width: 180px; z-index: 5;
  }
  #leaderboard h3 { font-size: 14px; margin-bottom: 6px; color: #5ecbff; }
  #leaderboard ol { padding-left: 18px; font-size: 13px; line-height: 1.5; }

  #minimap {
    position: fixed; bottom: 12px; right: 12px; width: 140px; height: 140px;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; z-index: 5;
  }

  #deathScreen {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; background: rgba(10,13,18,0.9); z-index: 20;
  }
  #deathScreen h2 { color: #ff5e5e; font-size: 32px; margin-bottom: 10px; }
  #deathScreen p { color: #fff; margin-bottom: 20px; font-size: 18px; }
</style>
</head>
<body>

<div id="startScreen">
  <h1>Worm<span>.io</span> Clone</h1>
  <input id="nameInput" type="text" placeholder="Enter your name" maxlength="16" />
  <button id="playBtn">Play</button>
  <div id="hint">Move your mouse to steer &middot; Hold click / space to boost</div>
</div>

<div id="deathScreen">
  <h2>You died!</h2>
  <p id="finalScore">Score: 0</p>
  <input id="nameInput2" type="text" placeholder="Enter your name" maxlength="16" />
  <button id="respawnBtn">Play Again</button>
</div>

<div id="hud" style="display:none;">Score: <span id="scoreVal">0</span></div>
<div id="leaderboard" style="display:none;">
  <h3>Leaderboard</h3>
  <ol id="leaderboardList"></ol>
</div>
<canvas id="minimap" width="140" height="140" style="display:none;"></canvas>

<canvas id="game"></canvas>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const minimap = document.getElementById('minimap');
const mctx = minimap.getContext('2d');

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let worldSize = 4000;
let latestState = null;
let mouseAngle = 0;
let boosting = false;
let joined = false;

const startScreen = document.getElementById('startScreen');
const deathScreen = document.getElementById('deathScreen');
const hud = document.getElementById('hud');
const leaderboardEl = document.getElementById('leaderboard');
const scoreVal = document.getElementById('scoreVal');
const leaderboardList = document.getElementById('leaderboardList');
const finalScore = document.getElementById('finalScore');

function startGame(name) {
  socket.emit('join', { name });
  startScreen.style.display = 'none';
  deathScreen.style.display = 'none';
  hud.style.display = 'block';
  leaderboardEl.style.display = 'block';
  minimap.style.display = 'block';
  joined = true;
}

document.getElementById('playBtn').addEventListener('click', () => {
  startGame(document.getElementById('nameInput').value);
});
document.getElementById('nameInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') startGame(document.getElementById('nameInput').value);
});
document.getElementById('respawnBtn').addEventListener('click', () => {
  socket.emit('respawn', { name: document.getElementById('nameInput2').value });
  deathScreen.style.display = 'none';
  hud.style.display = 'block';
  leaderboardEl.style.display = 'block';
  minimap.style.display = 'block';
});

canvas.addEventListener('mousemove', (e) => {
  const cx = canvas.width / 2, cy = canvas.height / 2;
  mouseAngle = Math.atan2(e.clientY - cy, e.clientX - cx);
});
canvas.addEventListener('mousedown', () => boosting = true);
canvas.addEventListener('mouseup', () => boosting = false);
window.addEventListener('keydown', (e) => { if (e.code === 'Space') boosting = true; });
window.addEventListener('keyup', (e) => { if (e.code === 'Space') boosting = false; });

// send input to server at a steady rate
setInterval(() => {
  if (!joined) return;
  socket.emit('input', { angle: mouseAngle, boosting });
}, 50);

socket.on('state', (state) => {
  latestState = state;
  if (state.worldSize) worldSize = state.worldSize;

  if (!state.you) {
    // dead
    if (joined) {
      joined = false;
      hud.style.display = 'none';
      leaderboardEl.style.display = 'none';
      minimap.style.display = 'none';
      deathScreen.style.display = 'flex';
    }
    // still update leaderboard while dead
    renderLeaderboard(state.leaderboard);
    return;
  }

  scoreVal.textContent = state.you.score;
  renderLeaderboard(state.leaderboard);
});

function renderLeaderboard(list) {
  leaderboardList.innerHTML = '';
  (list || []).forEach(p => {
    const li = document.createElement('li');
    li.textContent = `${p.name} — ${p.score}`;
    leaderboardList.appendChild(li);
  });
}

function drawGrid(camX, camY) {
  const gridSize = 100;
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  const startX = -(camX % gridSize);
  const startY = -(camY % gridSize);
  for (let x = startX; x < canvas.width; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = startY; y < canvas.height; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }
}

function render() {
  requestAnimationFrame(render);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!latestState || !latestState.you) return;

  const camX = latestState.you.x - canvas.width / 2;
  const camY = latestState.you.y - canvas.height / 2;

  drawGrid(camX, camY);

  // world border
  ctx.strokeStyle = '#ff5e5e';
  ctx.lineWidth = 4;
  ctx.strokeRect(-camX, -camY, worldSize, worldSize);

  // food
  for (const f of latestState.food) {
    const sx = f.x - camX, sy = f.y - camY;
    if (sx < -20 || sx > canvas.width + 20 || sy < -20 || sy > canvas.height + 20) continue;
    ctx.beginPath();
    ctx.arc(sx, sy, f.r, 0, Math.PI * 2);
    ctx.fillStyle = f.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = f.color;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // worms
  for (const w of latestState.worms) {
    ctx.fillStyle = w.color;
    for (let i = w.segments.length - 1; i >= 0; i--) {
      const s = w.segments[i];
      const sx = s.x - camX, sy = s.y - camY;
      const radius = i === 0 ? 10 : 8;
      ctx.beginPath();
      ctx.arc(sx, sy, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    // name label above head
    const head = w.segments[0];
    ctx.fillStyle = '#fff';
    ctx.font = '13px Segoe UI';
    ctx.textAlign = 'center';
    ctx.fillText(w.name, head.x - camX, head.y - camY - 20);
  }

  // minimap
  mctx.clearRect(0, 0, minimap.width, minimap.height);
  mctx.fillStyle = 'rgba(255,255,255,0.08)';
  mctx.fillRect(0, 0, minimap.width, minimap.height);
  const scale = minimap.width / worldSize;
  for (const w of latestState.worms) {
    const head = w.segments[0];
    mctx.fillStyle = w.color;
    mctx.beginPath();
    mctx.arc(head.x * scale, head.y * scale, 3, 0, Math.PI * 2);
    mctx.fill();
  }
}
render();
</script>
</body>
</html>
