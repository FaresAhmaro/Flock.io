<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flock.io — Live Multiplayer Test</title>
<style>
  html,body{ margin:0; height:100%; background:#0c1018; overflow:hidden; font-family:'Trebuchet MS',sans-serif; }
  canvas{ display:block; cursor:crosshair; }
  #hud{ position:fixed; top:14px; left:14px; color:#f3ecd8; text-shadow:0 2px 4px rgba(0,0,0,.6); }
  #hud .role{ font-size:20px; font-weight:bold; }
  #hud .role.wolf{ color:#ff8a7a; }
  #hud .role.sheep{ color:#fdfaf1; }
  #hud .hunger{ font-size:13px; margin-top:4px; }
  #lb{ position:fixed; top:14px; right:14px; width:190px; background:rgba(10,12,16,.6);
       border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:10px 12px; color:#f3ecd8; }
  #lb h3{ margin:0 0 6px; font-size:11px; letter-spacing:1px; text-transform:uppercase; opacity:.7; }
  #lb ol{ margin:0; padding-left:18px; font-size:13px; line-height:1.6; }
  #status{ position:fixed; bottom:14px; left:14px; color:#8fa; font-size:12px; opacity:.7; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="role" id="roleLabel">Connecting...</div>
  <div class="hunger" id="hungerLabel"></div>
</div>
<div id="lb"><h3>Live Players</h3><ol id="lbList"></ol></div>
<div id="status">connecting to server...</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

let myId = null, world = { w: 3000, h: 3000 }, hungerLimitMs = 300000;
let state = { players: [], foods: [] };
let camera = { x: world.w/2, y: world.h/2 };

const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(proto + '://' + location.host);

ws.onopen = () => { document.getElementById('status').textContent = 'connected'; };
ws.onclose = () => { document.getElementById('status').textContent = 'disconnected — is the server running?'; };
ws.onerror = () => { document.getElementById('status').textContent = 'connection error — check the server console'; };

ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);
  if(msg.type === 'welcome'){
    myId = msg.id; world = msg.world; hungerLimitMs = msg.hungerLimitMs;
  } else if(msg.type === 'state'){
    state = msg;
  }
};

let dir = { x: 0, y: 0 };
addEventListener('mousemove', (e) => {
  dir.x = e.clientX - innerWidth/2;
  dir.y = e.clientY - innerHeight/2;
});
setInterval(() => {
  if(ws.readyState === WebSocket.OPEN){
    ws.send(JSON.stringify({ type:'input', dx: dir.x, dy: dir.y }));
  }
}, 60);

function radiusFor(mass, isWolf){
  const base = isWolf ? 22 : 14;
  const scale = Math.min(1 + mass/(isWolf?4000:20000), isWolf?3.2:2.4);
  return base*scale;
}
function worldToScreen(x,y){ return { x: x - camera.x + innerWidth/2, y: y - camera.y + innerHeight/2 }; }

function draw(){
  const me = state.players.find(p => p.id === myId);
  if(me){
    camera.x += (me.x - camera.x) * 0.15;
    camera.y += (me.y - camera.y) * 0.15;
    document.getElementById('roleLabel').textContent =
      (me.alive ? '' : '💀 ') + (me.role === 'wolf' ? '🐺 Wolf' : '🐑 Sheep') + ' — Mass ' + me.mass;
    document.getElementById('roleLabel').className = 'role ' + me.role;
    const secs = Math.ceil(me.hungerMs/1000);
    document.getElementById('hungerLabel').textContent =
      me.hungerMs < 30000 ? `⚠️ Eat now — ${secs}s left` : `Fed — ${secs}s until hungry`;
  }

  ctx.fillStyle = '#141a24';
  ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  const gs = 60;
  const offX = -(camera.x % gs), offY = -(camera.y % gs);
  for(let x=offX;x<innerWidth;x+=gs){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,innerHeight); ctx.stroke(); }
  for(let y=offY;y<innerHeight;y+=gs){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(innerWidth,y); ctx.stroke(); }

  const tl = worldToScreen(0,0), br = worldToScreen(world.w, world.h);
  ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 4;
  ctx.strokeRect(tl.x, tl.y, br.x-tl.x, br.y-tl.y);

  for(const f of state.foods){
    const s = worldToScreen(f.x, f.y);
    ctx.fillStyle = '#8fd66b';
    ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, 7); ctx.fill();
  }

  for(const p of state.players){
    if(!p.alive) continue;
    const s = worldToScreen(p.x, p.y);
    const r = radiusFor(p.mass, p.role === 'wolf');
    ctx.fillStyle = p.role === 'wolf' ? '#5b4636' : '#fdfaf1';
    ctx.strokeStyle = p.id === myId ? '#ffd23f' : 'rgba(0,0,0,.3)';
    ctx.lineWidth = p.id === myId ? 3 : 1.5;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = p.role === 'wolf' ? '#ffcf3f' : '#4a3a2c';
    ctx.beginPath(); ctx.arc(s.x - r*0.3, s.y - r*0.1, r*0.1, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(s.x + r*0.3, s.y - r*0.1, r*0.1, 0, 7); ctx.fill();
    ctx.fillStyle = p.id === myId ? '#ffd23f' : '#fff';
    ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(`${p.flag} ${p.name}`, s.x, s.y - r - 8);
  }

  const top = [...state.players].sort((a,b)=>b.mass-a.mass).slice(0,8);
  document.getElementById('lbList').innerHTML = top.map(p =>
    `<li style="color:${p.id===myId?'#ffd23f':'#fff'}">${p.role==='wolf'?'🐺':'🐑'} ${p.flag} ${p.name} — ${p.mass}</li>`
  ).join('');

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
