<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flock.io — Live Multiplayer</title>
<style>
  html,body{ margin:0; height:100%; background:#0c1018; overflow:hidden; font-family:'Trebuchet MS',sans-serif; }
  canvas{ display:block; cursor:crosshair; }
  #hud{ position:fixed; top:14px; left:14px; color:#f3ecd8; text-shadow:0 2px 4px rgba(0,0,0,.6); }
  #hud .role{ font-size:20px; font-weight:bold; }
  #hud .role.wolf{ color:#ff8a7a; }
  #hud .role.sheep{ color:#fdfaf1; }
  #hud .hunger{ font-size:13px; margin-top:4px; }
  #hud .buffs{ margin-top:6px; display:flex; gap:6px; flex-wrap:wrap; max-width:230px; }
  #hud .buff{ background:rgba(0,0,0,.4); border:1px solid rgba(255,255,255,.25); border-radius:12px; padding:2px 8px; font-size:11px; }
  #lb{ position:fixed; top:14px; right:14px; width:200px; background:rgba(10,12,16,.6);
       border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:10px 12px; color:#f3ecd8; }
  #lb h3{ margin:0 0 6px; font-size:11px; letter-spacing:1px; text-transform:uppercase; opacity:.7; }
  #lb ol{ margin:0; padding-left:18px; font-size:13px; line-height:1.6; }
  #radar{ position:fixed; left:14px; bottom:14px; opacity:0; transition:opacity .3s ease; }
  #status{ position:fixed; bottom:14px; right:14px; color:#8fa; font-size:12px; opacity:.7; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="role" id="roleLabel">Connecting...</div>
  <div class="hunger" id="hungerLabel"></div>
  <div class="buffs" id="buffRow"></div>
</div>
<div id="lb"><h3>Live Players</h3><ol id="lbList"></ol></div>
<canvas id="radar" width="150" height="150"></canvas>
<div id="status">connecting...</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); addEventListener('resize', resize);

const FOOD_VISUAL = {
  grass:   { emoji:null, color:'#8fd66b' },
  apple:   { emoji:'🍎' }, corn: { emoji:'🌽' }, noodles:{ emoji:'🍜' },
  momo:    { emoji:'🥟' }, sushi:{ emoji:'🍣' }, sashimi:{ emoji:'🍱' },
  burger:  { emoji:'🍔' }, pizza:{ emoji:'🍕' }, donut:  { emoji:'🍩' },
  golden:  { emoji:'🌟' }, energy:{ emoji:'⚡' }, turbo:  { emoji:'🥤' },
  eagleeye:{ emoji:'🔭' }, shield:{ emoji:'🛡️' }, magnet: { emoji:'🧲' },
};

let myId = null, world = { w: 6000, h: 6000 }, hungerLimitMs = 300000;
let state = { players: [], foods: [], kingSheepId:null, kingWolfId:null, leaderboard:[] };
let camera = { x: world.w/2, y: world.h/2 };

const proto = location.protocol === 'https:' ? 'wss' : 'ws';
const ws = new WebSocket(proto + '://' + location.host);
ws.onopen = () => { document.getElementById('status').textContent = 'connected'; };
ws.onclose = () => { document.getElementById('status').textContent = 'disconnected'; };
ws.onerror = () => { document.getElementById('status').textContent = 'connection error'; };
ws.onmessage = (event) => {
  const msg = JSON.parse(event.data);
  if (msg.type === 'welcome'){ myId = msg.id; world = msg.world; hungerLimitMs = msg.hungerLimitMs; }
  else if (msg.type === 'state'){ state = msg; }
};

let dir = { x: 0, y: 0 };
addEventListener('mousemove', (e) => { dir.x = e.clientX - innerWidth/2; dir.y = e.clientY - innerHeight/2; });
addEventListener('touchmove', (e) => {
  if (e.touches[0]){ dir.x = e.touches[0].clientX - innerWidth/2; dir.y = e.touches[0].clientY - innerHeight/2; }
}, { passive:true });
setInterval(() => { if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type:'input', dx:dir.x, dy:dir.y })); }, 60);

function radiusFor(mass, isWolf){
  const base = isWolf ? 22 : 14;
  const scale = Math.min(1 + mass/(isWolf?4000:20000), isWolf?3.2:2.4);
  return base*scale;
}
function worldToScreen(x,y){ return { x: x - camera.x + innerWidth/2, y: y - camera.y + innerHeight/2 }; }

// stable per-player animation phase, derived from their id, so every
// sheep/wolf's eyes wiggle and tongue wags on its own independent beat
function seedFromId(id){
  let h = 0;
  for (let i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) >>> 0;
  return (h % 1000) / 1000 * Math.PI * 2;
}

function drawSheep(p, isMe, t){
  const s = worldToScreen(p.x, p.y);
  if (s.x < -60 || s.x > innerWidth+60 || s.y < -60 || s.y > innerHeight+60) return;
  const r = radiusFor(p.mass, false);
  const seed = seedFromId(p.id);

  ctx.fillStyle = '#fdfaf1';
  ctx.strokeStyle = isMe ? '#ffd23f' : 'rgba(0,0,0,.3)';
  ctx.lineWidth = isMe ? 3 : 1.5;
  ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7); ctx.fill(); ctx.stroke();

  // wiggly wool — each tuft bobs on its own phase
  const woolCount = p.mass > 2000 ? 10 : p.mass > 500 ? 8 : 6;
  for (let i=0;i<woolCount;i++){
    const a = (i/woolCount)*Math.PI*2;
    const wobble = r*0.8 + Math.sin(t*3 + seed + i)*r*0.06;
    ctx.beginPath(); ctx.arc(s.x+Math.cos(a)*wobble, s.y+Math.sin(a)*wobble, r*0.24, 0, 7); ctx.fill();
  }

  // blush
  ctx.fillStyle = 'rgba(255,140,140,.55)';
  ctx.beginPath(); ctx.arc(s.x - r*0.55, s.y + r*0.14, r*0.16, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(s.x + r*0.55, s.y + r*0.14, r*0.16, 0, 7); ctx.fill();

  // googly eyes — whites stay put, pupils drift around in a little circle
  const pupilX = Math.cos(t*2.2 + seed) * r*0.05;
  const pupilY = Math.sin(t*2.2 + seed) * r*0.05;
  for (const side of [-1, 1]){
    const ex = s.x + side*r*0.3, ey = s.y - r*0.12;
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(ex, ey, r*0.18, 0, 7); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2b2117';
    ctx.beginPath(); ctx.arc(ex+pupilX, ey+pupilY, r*0.09, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    ctx.beginPath(); ctx.arc(ex+pupilX-r*0.03, ey+pupilY-r*0.03, r*0.03, 0, 7); ctx.fill();
  }

  if (p.mass >= 2000){
    ctx.strokeStyle = '#6b5539'; ctx.lineWidth = r*0.14; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(s.x-r*0.4,s.y-r*0.5); ctx.lineTo(s.x-r*0.7,s.y-r*0.9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(s.x+r*0.4,s.y-r*0.5); ctx.lineTo(s.x+r*0.7,s.y-r*0.9); ctx.stroke();
  }
  if (p.id === state.kingSheepId){
    ctx.font = `${r*0.8}px serif`; ctx.textAlign='center';
    ctx.fillText('🥇', s.x, s.y - r - 22);
  }
  ctx.fillStyle = isMe ? '#ffd23f' : '#fff';
  ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(`${p.flag} ${p.name}`, s.x, s.y - r - 8);
}

function drawWolf(p, t){
  const s = worldToScreen(p.x, p.y);
  if (s.x < -60 || s.x > innerWidth+60 || s.y < -60 || s.y > innerHeight+60) return;
  const r = radiusFor(p.mass, true);
  const seed = seedFromId(p.id);

  ctx.globalAlpha = p.shadow ? 0.55 : 1;
  ctx.fillStyle = p.shadow ? '#4b2b52' : '#5b4636';
  ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 7); ctx.fill();

  // big ears
  ctx.beginPath();
  ctx.moveTo(s.x-r*0.55, s.y-r*0.75); ctx.lineTo(s.x-r*0.85, s.y-r*1.35); ctx.lineTo(s.x-r*0.15, s.y-r*0.9); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(s.x+r*0.55, s.y-r*0.75); ctx.lineTo(s.x+r*0.85, s.y-r*1.35); ctx.lineTo(s.x+r*0.15, s.y-r*0.9); ctx.fill();

  // eyebrows — the bit that makes it read as "funny/fierce" instead of blank
  ctx.strokeStyle = p.shadow ? '#2a1030' : '#2e2115'; ctx.lineWidth = r*0.08; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(s.x-r*0.44, s.y-r*0.26); ctx.lineTo(s.x-r*0.16, s.y-r*0.36); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(s.x+r*0.44, s.y-r*0.26); ctx.lineTo(s.x+r*0.16, s.y-r*0.36); ctx.stroke();

  // eyes
  ctx.fillStyle = p.shadow ? '#ff5cd6' : '#ffcf3f';
  ctx.beginPath(); ctx.arc(s.x-r*0.3, s.y-r*0.1, r*0.11, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(s.x+r*0.3, s.y-r*0.1, r*0.11, 0, 7); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(s.x-r*0.3, s.y-r*0.1, r*0.045, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(s.x+r*0.3, s.y-r*0.1, r*0.045, 0, 7); ctx.fill();

  // snout, teeth, and a wagging tongue
  ctx.fillStyle = p.shadow ? '#3a1f42' : '#4a3527';
  ctx.beginPath(); ctx.ellipse(s.x, s.y+r*0.42, r*0.32, r*0.2, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.moveTo(s.x-r*0.18, s.y+r*0.34); ctx.lineTo(s.x-r*0.1, s.y+r*0.34); ctx.lineTo(s.x-r*0.14, s.y+r*0.48); ctx.fill();
  ctx.beginPath(); ctx.moveTo(s.x+r*0.18, s.y+r*0.34); ctx.lineTo(s.x+r*0.1, s.y+r*0.34); ctx.lineTo(s.x+r*0.14, s.y+r*0.48); ctx.fill();
  const wag = Math.sin(t*6 + seed) * r*0.12;
  ctx.fillStyle = '#e85a6b';
  ctx.beginPath(); ctx.ellipse(s.x+wag, s.y+r*0.66, r*0.14, r*0.22, 0, 0, 7); ctx.fill();

  ctx.globalAlpha = 1;
  if (p.id === state.kingWolfId){
    ctx.font = `${r*0.8}px serif`; ctx.textAlign='center';
    ctx.fillText('🩸', s.x, s.y - r - 22);
  }
  ctx.fillStyle = '#ff8a7a';
  ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(`${p.flag} ${p.name}${p.shadow?' 👻':''}`, s.x, s.y - r - 8);
}

function draw(){
  const t = performance.now()/1000;
  const me = state.players.find(p => p.id === myId);
  if (me){
    camera.x += (me.x - camera.x) * 0.15;
    camera.y += (me.y - camera.y) * 0.15;

    document.getElementById('roleLabel').textContent =
      (me.alive ? '' : '💀 ') + (me.role === 'wolf' ? '🐺 Wolf' : '🐑 Sheep') + ' — Mass ' + me.mass;
    document.getElementById('roleLabel').className = 'role ' + me.role;
    const secs = Math.ceil(me.hungerMs/1000);
    document.getElementById('hungerLabel').textContent =
      me.hungerMs < 30000 ? `⚠️ Eat now — ${secs}s left` : `Fed — ${secs}s until hungry`;

    let buffHtml = '';
    if (me.boostMsLeft > 0){
      const icon = me.boostType === 'golden' ? '✨' : me.boostType === 'turbo' ? '🥤' : '⚡';
      buffHtml += `<span class="buff">${icon} ${Math.ceil(me.boostMsLeft/1000)}s</span>`;
    }
    if (me.visionMsLeft > 0) buffHtml += `<span class="buff">🔭 ${Math.ceil(me.visionMsLeft/1000)}s</span>`;
    if (me.shieldMsLeft > 0) buffHtml += `<span class="buff">🛡️ ${Math.ceil(me.shieldMsLeft/1000)}s</span>`;
    if (me.magnetMsLeft > 0) buffHtml += `<span class="buff">🧲 ${Math.ceil(me.magnetMsLeft/1000)}s</span>`;
    document.getElementById('buffRow').innerHTML = buffHtml;

    const radarEl = document.getElementById('radar');
    if (me.visionMsLeft > 0){
      radarEl.style.opacity = 1;
      const rctx = radarEl.getContext('2d');
      rctx.clearRect(0,0,150,150);
      const cx=75, cy=75, R=64, range=1000;
      rctx.fillStyle='rgba(8,10,14,.6)';
      rctx.beginPath(); rctx.arc(cx,cy,R,0,7); rctx.fill();
      rctx.strokeStyle='rgba(155,123,255,.5)'; rctx.lineWidth=2; rctx.stroke();
      rctx.fillStyle='#fff'; rctx.beginPath(); rctx.arc(cx,cy,3,0,7); rctx.fill();
      for (const p of state.players){
        if (p.role !== 'wolf' || !p.alive) continue;
        const dx=p.x-me.x, dy=p.y-me.y, d=Math.hypot(dx,dy);
        if (d>range) continue;
        rctx.fillStyle = p.shadow ? '#ff5cd6' : '#ff4d4d';
        rctx.beginPath(); rctx.arc(cx+(dx/range)*R, cy+(dy/range)*R, 4, 0, 7); rctx.fill();
      }
    } else radarEl.style.opacity = 0;
  }

  ctx.fillStyle = '#141a24';
  ctx.fillRect(0,0,innerWidth,innerHeight);
  ctx.strokeStyle = 'rgba(255,255,255,.05)';
  const gs = 60;
  const offX = -(camera.x % gs), offY = -(camera.y % gs);
  for (let x=offX;x<innerWidth;x+=gs){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,innerHeight); ctx.stroke(); }
  for (let y=offY;y<innerHeight;y+=gs){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(innerWidth,y); ctx.stroke(); }

  const tl = worldToScreen(0,0), br = worldToScreen(world.w, world.h);
  ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 4;
  ctx.strokeRect(tl.x, tl.y, br.x-tl.x, br.y-tl.y);

  for (const f of state.foods){
    const s = worldToScreen(f.x, f.y);
    const v = FOOD_VISUAL[f.key] || FOOD_VISUAL.grass;
    if (v.emoji){
      ctx.font = '20px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(v.emoji, s.x, s.y);
    } else {
      ctx.fillStyle = v.color; ctx.beginPath(); ctx.arc(s.x, s.y, 4, 0, 7); ctx.fill();
    }
  }

  for (const p of state.players){
    if (!p.alive) continue;
    if (p.role === 'wolf') drawWolf(p, t); else drawSheep(p, p.id === myId, t);
  }

  // leaderboard now comes straight from the server (it tracks the global top 8 —
  // each client only receives nearby players, so we can't compute this locally anymore)
  const top = state.leaderboard || [];
  document.getElementById('lbList').innerHTML = top.map(p =>
    `<li style="color:${p.id===myId?'#ffd23f':'#fff'}">${p.role==='wolf'?'🐺':'🐑'} ${p.flag} ${p.name} — ${p.mass}</li>`
  ).join('');

  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
